name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
  # release-please.yml runs it on the release pull request's branch (see the last step).
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # The release pull request is written by Actions (github-actions[bot]), which signs nothing,
      # and GitHub starts no pull_request_target run for a pull request it opens: release-please.yml
      # dispatches this run on the release branch so that the required `cla` check exists. Only
      # that branch passes here; any other dispatch fails.
      - name: Release pull request (no one to sign)
        if: github.event_name == 'workflow_dispatch'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            release-please--branches--*) echo "$BRANCH is the release pull request, written by github-actions[bot]: nothing to sign" ;;
            *) echo "::error::A dispatched CLA run is only for the release-please branch, not $BRANCH"; exit 1 ;;
          esac

      # Never checks out pull request code: it only reads comments and writes signatures.
      - if: github.event_name != 'workflow_dispatch'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/otea-dev/otea/blob/main/CLA.md
          # Signatures live on their own branch so they never touch main's history.
          branch: cla-signatures
          allowlist: Lartweib,dependabot[bot],renovate[bot],github-actions[bot]
