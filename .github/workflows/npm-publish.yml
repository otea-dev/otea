name: Publish to npm

# A release stages @otea/cli on npm, once the checks pass and the tag names the version in
# package.json (v0.2.0 for "version": "0.2.0"). Nothing is public yet: the workflow opens an issue
# for the owner, who approves the staged version on npmjs.com with 2FA.
#
# It runs as a release in two ways, with the same result:
# - release-please.yml dispatches it on the v* tag it just created (`publish` = true, run from the
#   tag). That is the normal way: a tag made with GITHUB_TOKEN fires no push event.
# - A v* tag pushed by a person fires `push: tags`.
# Any other manual run (workflow_dispatch with `publish` unchecked, from any branch or tag) does
# all of it up to the end and then only `npm stage publish --dry-run`: nothing reaches npm and no
# issue is opened.
#
# Staging signs in with npm trusted publishing (OIDC): no token is stored, and the package page on
# npm shows where it was built from (provenance). The trusted publisher on npmjs.com is stage-only
# ("Allow npm publish" unchecked), so a plain `npm publish` from here is rejected. npm checks the
# name of the workflow that runs: this file must be the top-level workflow, never a reusable one
# called from another file, or npm would see the caller's name (see CONTRIBUTING.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Stage the version of this v* tag on npm (run from the tag). Unchecked: a dry run."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Trusted publishing and the provenance statement are signed with the run's OIDC token.
      id-token: write
      # The issue that asks the owner to approve the staged version.
      issues: write
    steps:
      # A release is a v* tag, from a push or from a dispatch with `publish`. Anything else is a dry run.
      - name: Decide release or dry run
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          release=false
          if [ "$EVENT" = push ]; then
            release=true
          elif [ "$PUBLISH" = true ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) release=true ;;
              *) echo "::error::publish needs a run from a v* tag, not ${GITHUB_REF}"; exit 1 ;;
            esac
          fi
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "This run is a $([ "$release" = true ] && echo release || echo dry run) from ${GITHUB_REF}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The oldest Node the package supports (engines).
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # `npm stage` needs npm 11.15.0 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11.15.0
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The same entry as ci.yml (npm run check runs it), so the two cannot drift.
      - run: npm run test

      - name: Check that the tag names the package version
        if: steps.mode.outputs.release == 'true'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME} but package.json says version ${version}: the tag must be v<package.json version>"
            exit 1
          fi

      # Packs what npm would publish (prepack builds the UI and compiles the CLI), installs it the
      # way a person does, with nothing of the checkout around it, and runs it.
      - name: Try the package from a clean install
        run: |
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/prefix" "$RUNNER_TEMP/work"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          npm install -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP"/pack/otea-cli-*.tgz
          cd "$RUNNER_TEMP/work"
          export OTEA_HOME="$RUNNER_TEMP/otea-home"
          installed="$("$RUNNER_TEMP/prefix/bin/otea" --version)"
          expected="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          if [ "$installed" != "$expected" ]; then
            echo "::error::The installed otea says $installed, expected $expected"
            exit 1
          fi
          "$RUNNER_TEMP/prefix/bin/otea" --help > /dev/null

      - name: Stage (dry run)
        if: steps.mode.outputs.release != 'true'
        run: npm stage publish --dry-run --access public

      - name: Stage on npm
        id: stage
        if: steps.mode.outputs.release == 'true'
        # bash with pipefail, so a failing npm is not hidden by the tee after it.
        shell: bash
        run: |
          # A prerelease (v0.2.0-rc.1) goes to the "next" tag, so npm i -g @otea/cli never takes it.
          tag=latest
          case "${GITHUB_REF_NAME}" in *-*) tag=next ;; esac
          npm stage publish --provenance --access public --tag "$tag" 2>&1 | tee "$RUNNER_TEMP/stage.log"
          # npm prints: + @otea/cli@0.2.0 (staged with id <id>)
          stage_id="$(sed -n 's/.*(staged with id \([^)]*\)).*/\1/p' "$RUNNER_TEMP/stage.log" | head -n 1)"
          if [ -z "$stage_id" ]; then
            echo "::warning::npm did not print a stage id: find the version under Staged Packages on npmjs.com, or run npm stage list @otea/cli"
            stage_id="unknown (see Staged Packages on npmjs.com, or run npm stage list @otea/cli)"
          fi
          echo "stage_id=${stage_id}" >> "$GITHUB_OUTPUT"

      - name: Ask the owner to approve
        if: steps.mode.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE_ID: ${{ steps.stage.outputs.stage_id }}
        run: |
          VERSION="$(node -p "require('./package.json').version")" bash .github/scripts/npm-stage-notify.sh
