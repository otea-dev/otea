name: Release

# Keeps one release pull request open on main: it bumps the version of @otea/cli and of
# desktop/package.json together, from the conventional commits since the last release, and writes
# CHANGELOG.md. Merging that pull request is how the owner decides to release: this workflow then
# creates the v* tag and the GitHub Release (with the changelog as its notes) and starts the two
# release workflows, desktop.yml (installers, attached to that Release) and npm-publish.yml (stages
# @otea/cli on npm and opens the approval issue). Config: release-please-config.json and
# .release-please-manifest.json. See CONTRIBUTING.md > Releasing.
#
# This uses the run's GITHUB_TOKEN, so no secret is needed. Anything it creates with that token (the
# release pull request, the tag) does not start other workflows by itself, which GitHub does on
# purpose to avoid loops, except a workflow_dispatch. So the two steps below start what the missing
# events would have started:
#
# - A release creates its tag with no `push: tags` event: the tag is dispatched to desktop.yml and
#   npm-publish.yml with `gh workflow run --ref <tag>`. Each of them runs as its own top-level
#   workflow, which npm trusted publishing needs: it checks the workflow file that is running (see
#   npm-publish.yml). Calling it as a reusable workflow from this file would name this file instead.
#   Because the tag push never fires, a release runs each workflow once.
# - The release pull request opens with no pull_request event, so the required checks would never
#   run on it: ci.yml is dispatched on its branch, and its checks attach to the head. cla.yml cannot
#   be dispatched the same way: GitHub does not associate a dispatched run's check suite with the
#   pull request, so the required `cla` would never show on it. Instead the last step posts a
#   commit status named `cla` on the head, which does attach by SHA. That is the one reason for the
#   `statuses: write` permission, and the step posts only for a pull request on the release branch
#   that github-actions[bot] opened, which is on the CLA allowlist in cla.yml.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The tag, the release, the release branch and CHANGELOG.md.
      contents: write
      # The release pull request and its labels.
      pull-requests: write
      issues: write
      # `gh workflow run`.
      actions: write
      # The `cla` commit status on the release pull request's head (see the last step).
      statuses: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Start the installer and npm workflows on the new tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh workflow run desktop.yml --ref "$TAG"
          gh workflow run npm-publish.yml --ref "$TAG" -f publish=true
          echo "Started desktop.yml and npm-publish.yml on $TAG" >> "$GITHUB_STEP_SUMMARY"

      # release-please can fail after it made the tag and the Release (for example, on a comment it
      # cannot post), which skips the step above. This one then starts what is missing. It dispatches
      # only when the Release for the version in the manifest has no installer and neither workflow
      # has a run on that tag, so a tag is never dispatched twice.
      - name: Start the release workflows if the step above was skipped
        if: failure() && steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          version="$(gh api "repos/$GH_REPO/contents/.release-please-manifest.json?ref=$SHA" --jq .content | base64 -d | jq -r '.["."]')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then echo "No version in the manifest"; exit 0; fi
          TAG="v$version"
          if ! gh release view "$TAG" > /dev/null 2>&1; then echo "No Release for $TAG: nothing to start" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          installers="$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(endswith(".exe"))] | length')"
          if [ "$installers" != "0" ]; then echo "$TAG already has installers: nothing to start" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          for wf in desktop.yml npm-publish.yml; do
            runs="$(gh run list --workflow "$wf" --branch "$TAG" --limit 1 --json databaseId --jq length)"
            if [ "$runs" != "0" ]; then echo "$wf already ran on $TAG: nothing to start" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          done
          gh workflow run desktop.yml --ref "$TAG"
          gh workflow run npm-publish.yml --ref "$TAG" -f publish=true
          echo "Fallback: started desktop.yml and npm-publish.yml on $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Run the CI checks on the release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          branch="$(jq -r '.headBranchName' <<< "$PR")"
          gh workflow run ci.yml --ref "$branch"
          echo "Started ci.yml on $branch" >> "$GITHUB_STEP_SUMMARY"

      # Runs every time, not only when release-please changed the pull request: it says "PR remained
      # the same" and outputs no `pr` then, and a new head commit needs the status again. It looks the
      # pull request up by its branch instead.
      - name: Give the release pull request its cla status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: release-please--branches--main--components--cli
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Open, from this branch of this repository (not a fork), opened by github-actions[bot].
          sha="$(gh api "repos/$GH_REPO/pulls?state=open&head=$OWNER:$BRANCH" --jq             ".[] | select(.head.ref == \"$BRANCH\" and .head.repo.full_name == \"$GH_REPO\" and .user.login == \"github-actions[bot]\") | .head.sha" | head -n 1)"
          if [ -z "$sha" ]; then
            echo "No open release pull request from github-actions[bot] on $BRANCH: no cla status to post" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api "repos/$GH_REPO/statuses/$sha"             -f state=success             -f context=cla             -f description="Release PR by github-actions[bot]: on the CLA allowlist"             -f target_url="$RUN_URL"
          echo "Posted the cla status on ${sha:0:7} of $BRANCH" >> "$GITHUB_STEP_SUMMARY"
