name: Copilot review

# Asks GitHub Copilot to review a pull request from someone outside the project (see
# .github/copilot-instructions.md). Members, collaborators, the owner and bots (dependabot,
# release-please) are not reviewed.
#
# pull_request_target, so a fork's pull request gets a token that can write to it. That is safe here
# because the job never checks out, builds or runs the pull request's code: it only calls the API,
# and it passes nothing from the event into a script except through env.
on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    steps:
      - name: Request a Copilot review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh api --method POST "repos/$GH_REPO/pulls/$PR/copilot-code-review" >/dev/null; then
            echo "Copilot review requested (REST)"
          elif gh pr edit "$PR" --add-reviewer @copilot >/dev/null; then
            echo "Copilot review requested (gh pr edit)"
          else
            # Not a failure of the pull request: the token may not be allowed to ask Copilot.
            echo "::warning::Could not request a Copilot review for #$PR; request it by hand from Reviewers."
          fi
